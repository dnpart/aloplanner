<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloplanner – Time check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8EC5FF}a:hover{color:#B8DAFF}
.lbl{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:0.06em;color:#B4C0D8}
.btn{height:52px;border-radius:26px;font-family:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn-p{border:none;background:#8EC5FF;color:#0B1330}
.btn-s{border:2px solid #8EC5FF;background:transparent;color:#B8DAFF}
.row{display:flex;align-items:center;gap:12px;min-height:44px}
.row input{width:22px;height:22px;accent-color:#8EC5FF;margin:0;flex-shrink:0}
.row label{font-size:15px;line-height:21px}
</style>
</helmet>
<div style="width: 390px; height: 860px; position: relative; overflow: hidden; font-family: Lexend, 'Atkinson Hyperlegible', Verdana, sans-serif; color: #EEF2FA; background: radial-gradient(120% 70% at 50% 20%, #24325E 0%, #0B1330 70%); letter-spacing: 0.01em; display: flex; flex-direction: column; align-items: center; padding: 40px 24px 28px; box-sizing: border-box; gap: 16px">

<img src="/_blob/27b2e95b3c7f91a91b7da844fb58a9f1" alt="Owl" style="width: 132px; height: 140px">
<div style="background: #24325E; border-radius: 18px; padding: 12px 16px; text-align: center"><p style="margin: 0; font-size: 15px; line-height: 22px">Hoo's still rigging? You. Wrap up soon, legend.</p></div>

<div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
<p class="lbl">TIME CHECK · 7:50 PM</p>
<p style="margin: 0; font-size: 56px; line-height: 64px; font-weight: 600; letter-spacing: 0.02em">10:00</p>
<p style="margin: 0; font-size: 16px; line-height: 23px">left on rigging. Next up: <span style="font-weight: 600">Post TikTok clip</span></p>
</div>

<div style="align-self: stretch; background: rgba(30,42,80,0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
<p class="lbl">WRAP-UP CHECKLIST</p>
<div class="row"><input type="checkbox" id="w1"><label for="w1">Save the Live2D file</label></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px">
<label for="left" style="font-size: 15px">Note for future you: where I left off</label>
<input id="left" type="text" placeholder="Left arm done, start right arm" style="height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(11,19,48,0.6); color: #EEF2FA; padding: 0 12px; font-family: inherit; font-size: 15px">
</div>
</div>

<div style="flex-grow: 1"></div>
<div style="align-self: stretch; display: flex; flex-direction: column; gap: 10px">
<button class="btn btn-p">Start wrapping up</button>
<button class="btn btn-s">+10 min (1 left today)</button>
<a href="#" style="align-self: center; font-size: 14px; min-height: 44px; display: flex; align-items: center">Turn off check-ins for this block</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
