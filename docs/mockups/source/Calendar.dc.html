<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aloplanner – Plan calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8EC5FF}a:hover{color:#B8DAFF}
.card{background:rgba(30,42,80,0.82);border:1px solid rgba(255,255,255,0.08);border-radius:20px}
.chip{display:inline-flex;align-items:center;font-size:13px;line-height:18px;font-weight:500;padding:3px 10px;border-radius:12px;color:#0B1330}
.lbl{margin:0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:0.06em;color:#B4C0D8}
.btn{height:48px;border-radius:24px;font-family:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.seg{flex:1;height:44px;border:none;border-radius:22px;background:transparent;color:#B4C0D8;font-family:inherit;font-size:15px}
.seg.on{background:#8EC5FF;color:#0B1330;font-weight:600}
.flt{height:44px;border-radius:22px;padding:0 14px;font-family:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,0.18);background:transparent;color:#B4C0D8}
.flt .d{width:10px;height:10px;border-radius:5px}
.flt.on{color:#0B1330;border-color:transparent}
.day{flex:1;height:72px;border-radius:16px;border:none;background:transparent;color:#EEF2FA;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.day .n{font-size:17px;font-weight:600}
.day .w{font-size:12px;color:#B4C0D8}
.day.on{background:#24325E;outline:2px solid #8EC5FF}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.ev .t{width:64px;flex-shrink:0;font-size:13px;line-height:21px;color:#B4C0D8}
.nav{position:absolute;left:0;right:0;bottom:0;height:68px;background:rgba(11,19,48,0.94);display:flex;justify-content:space-around;align-items:center;border-top:1px solid rgba(255,255,255,0.08)}
.nav a{width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#B4C0D8;font-size:12px}
.nav a.on{color:#B8DAFF;font-weight:600}
.pill{width:52px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.nav a.on .pill{background:rgba(142,197,255,0.2)}
</style>
</helmet>
<div style="width: 390px; height: 860px; position: relative; overflow: hidden; font-family: Lexend, 'Atkinson Hyperlegible', Verdana, sans-serif; color: #EEF2FA; background: linear-gradient(180deg, #0B1330 0%, #17224A 55%, #24325E 100%); letter-spacing: 0.01em">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 0 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600">Plan</h1>
<button class="btn" style="height: 44px; border: none; background: #8EC5FF; color: #0B1330"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
</div>

<div style="display: flex; gap: 4px; padding: 4px; border-radius: 26px; background: rgba(255,255,255,0.06)" role="group" aria-label="Calendar view">
<button class="seg" aria-pressed="false">Day</button><button class="seg on" aria-pressed="true">Week</button><button class="seg" aria-pressed="false">Month</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p class="lbl">SHOW</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="Filter by type">
<button class="flt on" aria-pressed="true" style="background: #B9A6FF"><span class="d" style="background: #0B1330"></span>Stream</button>
<button class="flt on" aria-pressed="true" style="background: #FFB574"><span class="d" style="background: #0B1330"></span>Store</button>
<button class="flt on" aria-pressed="true" style="background: #F4A3C0"><span class="d" style="background: #0B1330"></span>Commission</button>
<button class="flt" aria-pressed="false"><span class="d" style="background: #7FD6C7"></span>Life</button>
<button class="flt" aria-pressed="false"><span class="d" style="background: #FFE08A"></span>Health</button>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Nov 10 – 16</h2>
<div style="display: flex; gap: 4px">
<button aria-label="Previous week" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: rgba(255,255,255,0.08); color: #EEF2FA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-label="Next week" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: rgba(255,255,255,0.08); color: #EEF2FA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div style="display: flex; gap: 2px">
<button class="day"><span class="w">Mon</span><span class="n">10</span><span class="dots"><i style="background: #F4A3C0"></i><i style="background: #B9A6FF"></i></span></button>
<button class="day"><span class="w">Tue</span><span class="n">11</span><span class="dots"><i style="background: #FFB574"></i></span></button>
<button class="day on" aria-pressed="true"><span class="w">Wed</span><span class="n">12</span><span class="dots"><i style="background: #F4A3C0"></i><i style="background: #FFB574"></i><i style="background: #B9A6FF"></i></span></button>
<button class="day"><span class="w">Thu</span><span class="n">13</span><span class="dots"><i style="background: #FFB574"></i><i style="background: #F4A3C0"></i></span></button>
<button class="day"><span class="w">Fri</span><span class="n">14</span><span class="dots"><i style="background: #B9A6FF"></i></span></button>
<button class="day"><span class="w">Sat</span><span class="n">15</span><span class="dots"><i style="background: #FFB574"></i></span></button>
<button class="day"><span class="w">Sun</span><span class="n">16</span><span class="dots"><i style="background: #B9A6FF"></i></span></button>
</div>

<div class="card" style="display: flex; flex-direction: column; overflow: hidden">
<div class="ev"><span class="t">10:00 AM</span><div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><span style="font-size: 15px; line-height: 21px">Rig face params: [CLIENT A]</span><span class="chip" style="align-self: flex-start; background: #F4A3C0">Commission · 2 hr</span></div></div>
<div class="ev"><span class="t">1:00 PM</span><div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><span style="font-size: 15px; line-height: 21px">Pick up next week's schedule</span><span class="chip" style="align-self: flex-start; background: #FFB574">Store · 15 min</span></div></div>
<div class="ev"><span class="t">4:00 PM</span><div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><span style="font-size: 15px; line-height: 21px">Check-in call: [CLIENT C]</span><span class="chip" style="align-self: flex-start; background: #F4A3C0">Commission · 30 min</span></div></div>
<div class="ev" style="border-bottom: none"><span class="t">7:00 PM</span><div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><span style="font-size: 15px; line-height: 21px">Stream: <span style="color: #FFB574; font-weight: 600">game not picked</span></span><span class="chip" style="align-self: flex-start; background: #B9A6FF">Stream · 3 hr</span></div></div>
</div>
<p style="margin: 0; font-size: 13px; color: #B4C0D8; text-align: center">3 Life and Health items hidden by filters</p>
</div>

<nav class="nav" aria-label="Main">

<a href="Stream.dc.html"><span class="pill"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"></circle><path d="M8 8a6 6 0 0 0 0 8M16 8a6 6 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"></path></svg></span>Stream</a>
<a href="Commissions.dc.html"><span class="pill"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"></path></svg></span>Work</a>
<a href="#"><span class="pill"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r="1"></circle><circle cx="18" cy="13.5" r="1"></circle></svg></span>Play</a>
</nav>
</div>
